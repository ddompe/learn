[project]
name = "learn-automation-ai-examples"
version = "0.1.0"
description = "Python examples for Automation & AI for Business Users course"
requires-python = ">=3.12"
dependencies = [
	"pandas>=2.1.0",
	"openpyxl>=3.1.0",
	"matplotlib>=3.8.0",
	"pytest>=7.4.0",
	"pyyaml>=6.0.3",
	"pyarrow>=25.0.1",
	"duckdb>=1.5.6",
	"seaborn>=0.13.2",
	"plotly>=7.1.0",
	"streamlit>=1.65.0",
]

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "--import-mode=importlib"
pythonpath = ["."]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
