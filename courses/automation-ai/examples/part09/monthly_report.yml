name: Monthly report

on:
  schedule:
    - cron: '0 13 1 * *' # 13:00 UTC on the 1st of each month
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the project
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
      - name: Run the tests
        run: uv run pytest
      - name: Run the pipeline
        run: uv run python pipeline.py
      - name: Keep the results
        uses: actions/upload-artifact@v4
        with:
          name: monthly-results
          path: output/
