name: Checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run checks
        run: npm run check

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: courses/*/examples/uv.lock
      - name: Run example tests
        working-directory: courses/automation-ai/examples
        run: uv run pytest
      - name: Check example outputs are fresh
        run: uv run --project courses/automation-ai/examples python scripts/run_examples.py --check
      - name: Translation status (report only)
        run: python3 scripts/check_translations.py
